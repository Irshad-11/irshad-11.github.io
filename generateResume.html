      /* ============================================================
         MODULE: RESUME GENERATOR
         Orchestrates template + data → LaTeX output.
         ============================================================ */
      const ResumeGenerator = (() => {
        function generate(projectId) {
          const project = ProjectManager.get(projectId);
          if (!project) return '';
          const template = TemplateRegistry.get(project.templateId);
          if (!template) return '% Error: template not found';
          const data = ProjectManager.getEffectiveData(projectId);
          const sections = project.sectionOrder || template.defaultSectionOrder;
          return template.latexGenerator(data, sections, project.hiddenSections || []);
        }

        function preview(projectId) {
          const project = ProjectManager.get(projectId);
          if (!project) return '';
          const template = TemplateRegistry.get(project.templateId);
          if (!template) return '<p>Template not found</p>';
          const data = ProjectManager.getEffectiveData(projectId);
          const sections = project.sectionOrder || template.defaultSectionOrder;
          return template.previewGenerator(data, sections, project.hiddenSections || []);
        }

        return { generate, preview };
      })();

      const ThemeManager = (() => {
        function getTheme() { return StorageManager.get('theme', 'light'); }
        function setTheme(t) {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.toggle('dark', t === 'dark');
          StorageManager.set('theme', t);
          document.getElementById('theme-icon-light').style.display = t === 'dark'  ? 'none' : '';
          document.getElementById('theme-icon-dark').style.display  = t === 'light' ? 'none' : '';
        }
        function toggle() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
        function init()   { setTheme(getTheme()); }
        return { init, toggle, getTheme };
      })();

      const Toast = (() => {
        function show(message, type = 'info', duration = 3000) {
          const el = document.createElement('div');
          el.className = `toast ${type}`;
          el.textContent = message;

      /* ============================================================
         MODULE: MODAL
         ============================================================ */
      const Modal = (() => {
  let _cb = null; // holds the real callback function (preserves closure)

  function open(title, bodyHtml, footerHtml) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML  = bodyHtml;
    document.getElementById('modal-footer').innerHTML = footerHtml || '<button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>';
    document.getElementById('modal-backdrop').classList.add('open');
  }

  function close() {
    document.getElementById('modal-backdrop').classList.remove('open');
  }

  function _run(...args) {
    const fn = _cb;
    _cb = null;
    if (typeof fn === 'function') fn(...args);
  }

  function prompt(title, label, defaultVal, cb) {
    const id = 'modal-input-' + Date.now();
    _cb = cb; // keep the real reference, don't stringify it
    open(title,
      `<label class="form-label">${label}</label><input id="${id}" class="form-input" value="${he(defaultVal||'')}"/>`,
      `<button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
       <button class="btn btn-primary" onclick="Modal.close(); Modal._run(document.getElementById('${id}').value)">OK</button>`
    );
    setTimeout(() => {
      const inp = document.getElementById(id);
      if (inp) { inp.focus(); inp.select(); }
    }, 100);
  }

  function confirm(title, message, cb) {
    _cb = cb;
    open(title, `<p style="color:var(--text-secondary);">${message}</p>`,
      `<button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
       <button class="btn btn-danger" onclick="Modal.close(); Modal._run()">Delete</button>`
    );
  }

  function select(title, bodyHtml, footerHtml) { open(title, bodyHtml, footerHtml); }

  return { open, close, prompt, confirm, select, _run };
})();

      // Generate a short unique ID
      function uid() {
        return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }

      // HTML escape
      function he(str) {
        if (str == null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Deep merge two objects
      function deepMerge(target, source) {
        const out = Object.assign({}, target);
        for (const key in source) {
          if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
            out[key] = deepMerge(target[key] || {}, source[key]);
          } else {
            out[key] = source[key];
          }
        }
        return out;
      }

      // Character limit helper: returns CSS class
      function charClass(curr, max) {
        if (curr >= max) return 'danger';
        if (curr >= max * 0.85) return 'warn';
        return '';
      }

      // Add character counter behavior to an input/textarea
      function attachCharCounter(inputEl, maxLen, counterId) {
        function update() {
          const len = inputEl.value.length;
          const el  = document.getElementById(counterId);
          if (!el) return;
          el.textContent = `${len} / ${maxLen}`;
          el.className = 'char-counter ' + charClass(len, maxLen);
          if (inputEl.value.length > maxLen) inputEl.value = inputEl.value.slice(0, maxLen);
        }
        inputEl.addEventListener('input', update);
        update();
      }

      // Debounce
      function debounce(fn, delay) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
      }

        function switchProfileTab(section) {
          document.querySelectorAll('.section-tab').forEach(el => el.classList.toggle('active', el.dataset.section === section));
          document.querySelectorAll('.profile-section').forEach(el => el.style.display = el.dataset.section === section ? '' : 'none');
          // Update progress
          updateProfileProgress();
        }

        function updateProfileProgress() {
          const form = document.getElementById('profile-form');
          if (!form) return;
          const inputs = form.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], textarea');
          let filled = 0;
          inputs.forEach(el => { if (el.value.trim()) filled++; });
          const pct = inputs.length ? Math.round((filled / inputs.length) * 100) : 0;
          const pg = document.getElementById('profile-progress');
          const pt = document.getElementById('profile-percent');
          if (pg) pg.style.width = pct + '%';
          if (pt) pt.textContent = pct + '%';
        }

          document.getElementById('ptab-sections').style.display = tab === 'sections' ? '' : 'none';
          document.getElementById('ptab-template').style.display = tab === 'template' ? '' : 'none';

          // Init sortable when sections tab opens
          if (tab === 'sections') {
            const list = document.getElementById('section-order-list');
            if (list && window.Sortable) {
              new Sortable(list, { animation: 150, handle: '.drag-handle', ghostClass: 'sortable-ghost' });
            }
          }
          if (window.lucide) lucide.createIcons();
        }

        function switchPdataTab(tab) {
          document.querySelectorAll('[data-pdtab]').forEach(el => {
            el.classList.toggle('active', el.dataset.pdtab === tab);
          });
          document.querySelectorAll('.pdata-section').forEach(el => {
            el.style.display = el.dataset.pdtab === tab ? '' : 'none';
          });
        }

            <div class="card" style="margin-bottom:16px;">
              <div class="card-header">Architecture Overview</div>
              <div class="card-body" style="font-size:13px; line-height:1.8; color:var(--text-secondary);">
                <p>ResumeForge uses a <strong>plugin-style Template Registry</strong>. Every template is a self-contained JavaScript object registered once. No other code changes are needed.</p>
                <p style="margin-top:8px;">The data pipeline is:</p>
                <div style="font-family:monospace; background:var(--bg-muted); padding:12px 16px; border-radius:8px; margin-top:8px; font-size:12px;">
                  User Profile (master data)<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;↓ deepMerge<br>
                  Project Overrides (per-resume edits)<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
                  Effective Data Object (passed to template)<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
                  template.latexGenerator(data, sections, hiddenSections)<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
                  LaTeX String → Overleaf → PDF
                </div>
              </div>
            </div>

            <div class="card" style="margin-bottom:16px;">
              <div class="card-header">Profile Data Object Reference</div>
              <div class="card-body">
                <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">These are ALL fields available in the <code>data</code> parameter of your <code>latexGenerator</code> and <code>previewGenerator</code> functions.</p>
                <pre style="font-family:monospace; font-size:11.5px; background:var(--bg-muted); padding:16px; border-radius:8px; overflow-x:auto; line-height:1.7; color:var(--text-primary);">${he(`// FLAT FIELDS
      data.firstName        // string
      data.middleName       // string
      data.lastName         // string
      data.preferredName    // string
      data.professionalTitle// string
      data.email            // string
      data.phone            // string
      data.alternatePhone   // string
      data.address          // string
      data.city             // string
      data.country          // string
      data.summary          // string (paragraph)

      // SOCIAL LINKS (strings)
      data.linkedin, data.github, data.portfolio
      data.website, data.googleScholar
      data.researchGate, data.stackoverflow

      // SKILLS OBJECT
      data.skills.programming  // e.g. "C, Python, JavaScript"
      data.skills.frameworks   // e.g. "React, FastAPI"
      data.skills.databases    // e.g. "SQLite, PostgreSQL"

      data.skills.languages    // e.g. "English, Bengali"
      data.skills.softSkills   // e.g. "Leadership"
      data.skills.other        // e.g. "..."

      // ARRAY SECTIONS (each item has an .id field)
      data.education[]
        .degree, .institution, .major, .gpa
        .startDate, .endDate, .description

      data.experience[]
        .company, .role, .startDate, .endDate
        .responsibilities  // newline-separated bullets
        .achievements      // newline-separated bullets

      data.projects[]
        .name, .techStack, .duration
        .description, .github, .liveLink

      data.certifications[]
        .title, .issuer, .date, .credentialUrl

      data.research[]
        .paperName, .venue, .doi, .url

      data.publications[]
        .title, .venue, .year, .url

      data.awards[]
        .award, .organization, .date, .description

      data.leadership[]
        .position, .organization, .description

      data.volunteering[]
        .organization, .role, .description

      data.languages[]
        .language, .proficiency

      data.references[]
        .name, .title, .company, .email, .phone`)}</pre>
              </div>

            <div class="card" style="margin-bottom:16px;">

                <pre style="font-family:monospace; font-size:12px; background:var(--bg-muted); padding:16px; border-radius:8px; overflow-x:auto; color:var(--text-primary);">${he(`// Escape special LaTeX characters (&, %, $, #, _, {, }, ~, ^, \\)
      ltx(str)              // Returns safe LaTeX string

      // Format a safe URL for \\href{url}{text}
      ltxUrl(url)           // Returns cleaned URL string

      // Format a date range "startDate -- endDate" or "startDate -- Present"
      ltxDate(start, end)   // Returns "Jun 2021 -- May 2025"

      // Split newline text into \\item lines (for itemize)

      /* ============================================================
         HELPER: FORM FIELD RENDERERS
         ============================================================ */

      // Standard text/email/url field with character counter
      function field(label, name, value, maxLen, type = 'text', placeholder = '') {
        const id = 'f_' + name.replace(/[\[\].]/g, '_');
        return `<div class="form-group">
          <label class="form-label" for="${id}">${he(label)}</label>
          <div class="field-wrap">
            <input class="form-input" type="${type}" id="${id}" name="${name}" data-field="${name}"
                   value="${he(value||'')}" maxlength="${maxLen}" placeholder="${he(placeholder)}"
                   oninput="updateCounter('${id}','${id}_counter',${maxLen})">
            <div class="char-counter" id="${id}_counter">${(value||'').length} / ${maxLen}</div>
          </div>
        </div>`;
      }

      // Textarea field with counter
      function textareaField(label, name, value, maxLen, placeholder = '', rows = 3) {
        const id = 'f_' + name.replace(/[\[\].]/g, '_');
        return `<div class="form-group">
          <label class="form-label" for="${id}">${he(label)}</label>
          <div class="field-wrap">
            <textarea class="form-textarea" id="${id}" name="${name}" data-field="${name}"
                      rows="${rows}" maxlength="${maxLen}" placeholder="${he(placeholder)}"
                      oninput="updateCounter('${id}','${id}_counter',${maxLen})">${he(value||'')}</textarea>
            <div class="char-counter" id="${id}_counter">${(value||'').length} / ${maxLen}</div>
          </div>
        </div>`;
      }

      // Project-level override field
      function projField(label, name, value, maxLen) {
        return field(label, name, value, maxLen, 'text', '');
      }

      function projTextarea(label, name, value, maxLen, rows = 3) {
        return textareaField(label, name, value, maxLen, '', rows);
      }

      // Update char counter
      function updateCounter(inputId, counterId, maxLen) {
        const inp = document.getElementById(inputId);
        const cnt = document.getElementById(counterId);
        if (!inp || !cnt) return;
        const len = inp.value.length;
        cnt.textContent = `${len} / ${maxLen}`;
        cnt.className = 'char-counter ' + charClass(len, maxLen);
      }

      function charClass(curr, max) {
        if (curr >= max) return 'danger';
        if (curr >= max * 0.85) return 'warn';
        return '';
      }


      /* ============================================================
         HELPER: NESTED VALUE SETTER
         e.g. setNestedValue(obj, 'skills.programming', 'Python, C')
              setNestedValue(obj, 'experience[0].role', 'Engineer')
         ============================================================ */
      function setNestedValue(obj, path, value) {
        const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
          const part = parts[i];
          if (cur[part] === undefined) {
            cur[part] = isNaN(parseInt(parts[i+1])) ? {} : [];
          }
          cur = cur[part];
        }
        cur[parts[parts.length - 1]] = value;
      }

        if (!project) return;
        const list = document.getElementById('section-order-list');
        if (!list) return;
        const items = list.querySelectorAll('[data-sec]');
        project.sectionOrder = Array.from(items).map(el => el.dataset.sec);
        project.updatedAt = Date.now();
        ProjectManager.save(project);
        refreshPreview(projectId);
        Toast.show('Section order saved!', 'success');
      }

      // Toggle section visibility
      function toggleSectionVisibility(projectId, sectionId) {
        const project = ProjectManager.get(projectId);
        if (!project) return;
        const hidden = project.hiddenSections || [];
        const idx = hidden.indexOf(sectionId);
        if (idx === -1) hidden.push(sectionId);
        else hidden.splice(idx, 1);
        project.hiddenSections = hidden;
        project.updatedAt = Date.now();
        ProjectManager.save(project);
        UI.navigate('project', projectId);
        setTimeout(() => UI.switchProjectTab('sections', projectId), 50);
      }

      // Change project template
      function changeProjectTemplate(projectId, templateId) {
        const project = ProjectManager.get(projectId);
        if (!project) return;
        const tmpl = TemplateRegistry.get(templateId);
        project.templateId = templateId;
        if (tmpl) project.sectionOrder = [...tmpl.defaultSectionOrder];
        project.updatedAt = Date.now();
        ProjectManager.save(project);
        UI.navigate('project', projectId);
        Toast.show('Template changed!', 'success');
      }

      // Show template detail modal
      function showTemplateDetail(id) {
        const t = TemplateRegistry.get(id);
        if (!t) return;
        Toast.show('Select this template when creating a new project.', 'info', 2000);
      }

      // New project in folder (from sidebar)
      function folderNewProject(folderId) {
        const templates = TemplateRegistry.getAll();
        const templateOptions = templates.map(t =>
          `<option value="${t.id}">${he(t.name)}</option>`
        ).join('');

        Modal.open('New Resume Project',
          `<div class="form-group">
            <label class="form-label">Project Name</label>
            <input class="form-input" id="new-project-name" placeholder="e.g. Google Internship Resume" value="New Resume"/>
          </div>
          <div class="form-group">
            <label class="form-label">Template</label>
            <select class="form-select" id="new-project-template">${templateOptions}</select>
          </div>`,
          `<button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
           <button class="btn btn-primary" onclick="
             const name = document.getElementById('new-project-name').value.trim();
             const tmpl = document.getElementById('new-project-template').value;
             Modal.close();
             if(name){ const p = ProjectManager.create('${folderId}', name, tmpl); UI.navigate('project', p.id); }
           ">Create</button>`
        );
        setTimeout(() => {
          const el = document.getElementById('new-project-name');
          if (el) { el.focus(); el.select(); }
        }, 100);
      }

      // Quick new project from dashboard
      function quickNewProject() {
        const folders = FolderManager.getFolders();
        if (!folders.length) {
          Toast.show('Create a folder first!', 'warn');
          return;
        }
        const folderOptions = folders.map(f => `<option value="${f.id}">${he(f.name)}</option>`).join('');
        const templateOptions = TemplateRegistry.getAll().map(t => `<option value="${t.id}">${he(t.name)}</option>`).join('');

        Modal.open('New Resume Project',
          `<div class="form-group">
            <label class="form-label">Folder</label>
            <select class="form-select" id="qnp-folder">${folderOptions}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Project Name</label>
            <input class="form-input" id="qnp-name" placeholder="e.g. Google Internship Resume" value="New Resume"/>
          </div>
          <div class="form-group">
            <label class="form-label">Template</label>
            <select class="form-select" id="qnp-template">${templateOptions}</select>
          </div>`,
          `<button class="btn btn-ghost" onclick="Modal.close()">Cancel</button>
           <button class="btn btn-primary" onclick="
             const fid  = document.getElementById('qnp-folder').value;
             const name = document.getElementById('qnp-name').value.trim();
             const tmpl = document.getElementById('qnp-template').value;
             Modal.close();
             if(name){ const p = ProjectManager.create(fid, name, tmpl); UI.navigate('project', p.id); }
           ">Create</button>`
        );
        setTimeout(() => {
          const el = document.getElementById('qnp-name');
          if (el) { el.focus(); el.select(); }
        }, 100);
      }

      // Capitalise first letter
      function capitalise(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      /* ============================================================
         MOBILE RESPONSIVE HELPERS
         ============================================================ */
      // Wrap the trailing text of the Export/Import header buttons in a
      // <span class="btn-label"> so it can be hidden independently of
      // the icon on very small screens (handled in the ≤480px CSS).
      function wrapHeaderButtonLabels() {
        ['btn-export', 'btn-import-trigger'].forEach(id => {
          const btn = document.getElementById(id);
          if (!btn || btn.querySelector('.btn-label')) return;
          Array.from(btn.childNodes).forEach(node => {
            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
              const span = document.createElement('span');
              span.className = 'btn-label';
              span.textContent = node.textContent;
              btn.replaceChild(span, node);
            }
          });
        });
      }


      /* ============================================================
         APP INITIALISATION
         ============================================================ */
      function initApp() {
        ThemeManager.init();
        // Reset / clear all saved data
        document.getElementById('btn-reset').addEventListener('click', () => {
          if (confirm('This will permanently delete all your saved profiles, folders, and resume projects from this browser. This cannot be undone. Continue?')) {
            StorageManager.clear();
            location.reload();
          }
        });

        // Theme toggle button
        document.getElementById('btn-theme').addEventListener('click', ThemeManager.toggle);

        // Hamburger (mobile)
        document.getElementById('hamburger-btn').addEventListener('click', UI.toggleMobileSidebar);
        document.getElementById('sidebar-overlay').addEventListener('click', UI.closeMobileSidebar);

        // Export / import
        document.getElementById('btn-export').addEventListener('click', StorageManager.exportAll);
        document.getElementById('btn-import-trigger').addEventListener('click', () => {
          document.getElementById('btn-import').click();
        });
        document.getElementById('btn-import').addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            if (StorageManager.importAll(ev.target.result)) {
              UI.renderSidebar();
              UI.navigate('dashboard');
            }
          };
          reader.readAsText(file);
          this.value = '';
        });

        // Modal close on backdrop click
        document.getElementById('modal-backdrop').addEventListener('click', function(e) {
          if (e.target === this) Modal.close();
        });

        // Render sidebar and default view
        UI.renderSidebar();
        UI.navigate('dashboard');

        // Init lucide icons
        if (window.lucide) lucide.createIcons();

        // Prep header buttons for the small-screen layout
        wrapHeaderButtonLabels();

        // Show onboarding if brand new user
        const profile = ProfileManager.getProfile();
        if (!profile.firstName && !StorageManager.get('onboarded')) {
          StorageManager.set('onboarded', true);
          setTimeout(() => {
            Modal.open('Welcome to ResumeForge! 🚀',
              `<div style="text-align:center; padding:8px 0;">
                <div style="font-size:40px; margin-bottom:12px;">📄</div>
                <p style="color:var(--text-secondary); font-size:13px; line-height:1.7;">
                  <strong>Start by completing your profile</strong> — it's the master data source for all your resumes.<br><br>
                  Then create a <strong>folder</strong> and a <strong>resume project</strong>, pick a template, and generate ATS-friendly LaTeX in seconds.
                </p>
              </div>`,
              `<button class="btn btn-ghost" onclick="Modal.close()">Skip for now</button>
               <button class="btn btn-primary" onclick="Modal.close(); UI.navigate('profile')">Complete Profile →</button>`
            );
          }, 600);
        }
      }

      // Run on DOMContentLoaded
      document.addEventListener('DOMContentLoaded', initApp);

      /*
        ================================================================
        TEMPLATE AUTHOR NOTES (inline, for anyone reading source)
        ================================================================
        To add a new template to this file:

        1. Find the section "MODULE: TEMPLATE REGISTRY" above.
        2. After the last TemplateRegistry.register({...}); call,
           add your own TemplateRegistry.register({...}); block.
        3. Your template MUST have:
             - id:              unique slug string
             - name:            display name
             - description:     short description string
             - targetAudience:  string
             - defaultSectionOrder: string[]  (section IDs)
             - variableMap:     object  (documentation only)
             - latexGenerator(data, sections, hiddenSections): function → string
             - previewGenerator(data, sections, hiddenSections): function → string
        4. Use ltx(), ltxUrl(), ltxDate(), ltxItems() helpers.
        5. The `data` object schema is documented in renderDevDocs().
        6. For preview, use buildPreviewSection(sec, data) for each section.
        7. Your template auto-appears in the template picker and project
           template changer — NO other code changes required.

        KEY VARIABLE PAIRS FOR TEMPLATE AUTHORS:
        ─────────────────────────────────────────
        Profile flat fields → LaTeX variables:
          data.firstName + data.lastName → \\bfseries NAME
          data.professionalTitle         → subtitle line
          data.email                     → \\href{mailto:...}{...}
          data.phone                     → plain text
          data.city + data.country       → location line
          data.linkedin / .github / .portfolio → \\href{url}{label}
          data.summary                   → summary paragraph

        Array sections → LaTeX environments:
          data.experience[] → itemize with \\item per responsibility line
          data.education[]  → tabular or manual formatting
          data.projects[]   → name + techStack + description items
          data.skills.*     → \\textbf{category}: comma-separated values
        ================================================================
      */
    </script>
  </body>
</html>
