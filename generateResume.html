<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeForge — Offline ATS Resume Builder</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- SortableJS for drag-and-drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Risque&display=swap" rel="stylesheet">  
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              forge: {
                50: "#f0f4ff",
                100: "#dde7ff",
                200: "#c2d3ff",
                300: "#97b4fe",
                400: "#6589fa",
                500: "#3d5ff5",
                600: "#2a3eea",
                700: "#1e2dd0",
                800: "#1e29a8",
                900: "#1e2784",
                950: "#141750",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "Fira Code", "monospace"],
              boldonse: ["Risque", "system-ui"],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ============================================================
     GLOBAL DESIGN TOKENS & BASE STYLES
     ============================================================ */
      :root {
        --sidebar-w: 260px;
        --header-h: 56px;
        --accent: #3d5ff5;
        --accent-hover: #2a3eea;
        --radius: 10px;
        --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Light theme tokens */
      [data-theme="light"] {
        --bg-base: #f8f9fc;
        --bg-surface: #ffffff;
        --bg-muted: #f1f4fa;
        --bg-sidebar: #ffffff;
        --border: #e2e6f0;
        --border-strong: #c8cedc;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-muted: #9ca3af;
        --shadow-sm:
          0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
      }

      /* Dark theme tokens */
      [data-theme="dark"] {
        --bg-base: #0d0f18;
        --bg-surface: #161926;
        --bg-muted: #1e2232;
        --bg-sidebar: #12162a;
        --border: #252a3e;
        --border-strong: #343858;
        --text-primary: #f1f3fb;
        --text-secondary: #8b90b0;
        --text-muted: #545872;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        transition:
          background var(--transition),
          color var(--transition);
        overflow: hidden;
        height: 100dvh;
      }

      /* ============================================================
     APP SHELL LAYOUT
     ============================================================ */
      #app-shell {
        display: grid;
        grid-template-rows: var(--header-h) 1fr;
        grid-template-columns: var(--sidebar-w) 1fr;
        grid-template-areas:
          "header header"
          "sidebar main";
        height: 100dvh;
        overflow: hidden;
      }

      /* Header */
      #app-header {
        grid-area: header;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        z-index: 100;
        box-shadow: var(--shadow-sm);
      }

      /* Sidebar */
      #app-sidebar {
        grid-area: sidebar;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform var(--transition),
          width var(--transition);
      }

      /* Main content */
      #app-main {
        grid-area: main;
        overflow-y: auto;
        background: var(--bg-base);
        position: relative;
      }

      /* ============================================================
     SIDEBAR STYLES
     ============================================================ */
      .sidebar-section {
        padding: 8px 12px 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 8px;
      }

      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 8px;
        margin: 1px 8px;
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      .sidebar-item:hover {
        background: var(--bg-muted);
        color: var(--text-primary);
      }

      .sidebar-item.active {
        background: #dde7ff;
        color: var(--accent);
      }

      [data-theme="dark"] .sidebar-item.active {
        background: #1e2368;
        color: #97b4fe;
      }

      .sidebar-item .item-icon {
        flex-shrink: 0;
      }

      /* Folder tree */
      .folder-item {
        margin: 1px 8px;
        border-radius: 8px;
      }

      .folder-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        cursor: pointer;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        transition: background var(--transition);
      }

      .folder-header:hover {
        background: var(--bg-muted);
      }

      .folder-projects {
        padding-left: 16px;
      }

      .project-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text-secondary);
        margin: 1px 0;
        transition:
          background var(--transition),
          color var(--transition);
      }

      .project-item:hover {
        background: var(--bg-muted);
        color: var(--text-primary);
      }
      .project-item.active {
        background: var(--bg-muted);
        color: var(--accent);
        font-weight: 600;
      }

      /* ============================================================
     CARD / PANEL STYLES
     ============================================================ */
      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 15px;
      }

      .card-body {
        padding: 20px;
      }

      /* ============================================================
     FORM ELEMENTS
     ============================================================ */
      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      .form-input,
      .form-textarea,
      .form-select {
        width: 100%;
        background: var(--bg-muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 11px;
        font-size: 13.5px;
        color: var(--text-primary);
        font-family: inherit;
        transition:
          border-color var(--transition),
          box-shadow var(--transition);
        outline: none;
      }

      .form-input:focus,
      .form-textarea:focus,
      .form-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(61, 95, 245, 0.15);
        background: var(--bg-surface);
      }

      .form-textarea {
        resize: vertical;
        min-height: 80px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .char-counter {
        font-size: 11px;
        color: var(--text-muted);
        text-align: right;
        margin-top: 3px;
        transition: color var(--transition);
      }

      .char-counter.warn {
        color: #f59e0b;
      }
      .char-counter.danger {
        color: #ef4444;
      }

      /* Field with counter wrapper */
      .field-wrap {
        position: relative;
      }

      /* ============================================================
     BUTTON STYLES
     ============================================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition:
          background var(--transition),
          transform 80ms,
          box-shadow var(--transition);
        text-decoration: none;
        font-family: inherit;
        white-space: nowrap;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--bg-muted);
        color: var(--text-primary);
      }

      .btn-danger {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }
      .btn-danger:hover {
        background: #fee2e2;
      }

      [data-theme="dark"] .btn-danger {
        background: #2d1111;
        color: #f87171;
        border-color: #4b1515;
      }

      .btn-sm {
        padding: 4px 10px;
        font-size: 12px;
      }
      .btn-icon {
        
        padding: 6px;
        border-radius: 6px;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
      }
      .btn-icon:hover {
        background: var(--bg-muted);
        color: var(--text-primary);
      }

      /* ============================================================
     BADGE / TAG
     ============================================================ */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
      }

      .badge-blue {
        background: #dde7ff;
        color: #2a3eea;
      }
      [data-theme="dark"] .badge-blue {
        background: #1e2368;
        color: #97b4fe;
      }

      .Project-Header {
        /* Mobile-first styles (no flex) */
        align-items: center; 
        gap: 10px; 
        margin-bottom: 18px; 
        flex-wrap: wrap;
      }

      /* Desktop styles (applied when screen is 768px or wider) */
      @media (min-width: 768px) {
        .Project-Header {
          display: flex;
        }
      }

      /* ============================================================
     TOAST / NOTIFICATION
     ============================================================ */
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      .toast {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 12px 16px;
        box-shadow: var(--shadow-lg);
        font-size: 13px;
        font-weight: 500;
        pointer-events: all;
        animation: slideIn 0.25s ease forwards;
        max-width: 320px;
        color: var(--text-primary);
      }

      .toast.success {
        border-left-color: #22c55e;
      }
      .toast.error {
        border-left-color: #ef4444;
      }
      .toast.warn {
        border-left-color: #f59e0b;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* ============================================================
     MODAL
     ============================================================ */
      #modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 500;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      #modal-backdrop.open {
        display: flex;
      }

      .modal-box {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 480px;
        animation: popIn 0.2s ease forwards;
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .modal-header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-body {
        padding: 20px;
      }
      .modal-footer {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* ============================================================
     SECTION TABS (for profile wizard sections)
     ============================================================ */
      .section-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        background: var(--bg-muted);
        border-radius: 8px;
        margin-bottom: 16px;
        scrollbar-width: none;
        flex-wrap: wrap;
      }
      .section-tabs::-webkit-scrollbar {
        display: none;
      }

      .section-tab {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        color: var(--text-secondary);
        transition:
          background var(--transition),
          color var(--transition);
        white-space: nowrap;
        border: none;
        background: transparent;
        font-family: inherit;
      }

      .section-tab:hover {
        background: var(--bg-surface);
        color: var(--text-primary);
      }
      .section-tab.active {
        background: var(--bg-surface);
        color: var(--accent);
        box-shadow: var(--shadow-sm);
      }

      /* ============================================================
     ENTRY CARDS (for experience, education items)
     ============================================================ */
      .entry-card {
        background: var(--bg-muted);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 10px;
        position: relative;
      }

      .entry-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .entry-card-title {
        font-weight: 600;
        font-size: 13.5px;
      }

      /* ============================================================
     LATEX OUTPUT AREA
     ============================================================ */
      .latex-output {
        background: #0d0f18;
        color: #c9d1d9;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        line-height: 1.7;
        padding: 20px;
        border-radius: 8px;
        overflow: auto;
        white-space: pre;
        max-height: 60vh;
        border: 1px solid #252a3e;
      }

      .latex-output .kw {
        color: #79c0ff;
      } /* keywords */
      .latex-output .cmd {
        color: #d2a8ff;
      } /* commands */
      .latex-output .arg {
        color: #a5d6a7;
      } /* arguments */
      .latex-output .cmt {
        color: #8b949e;
      } /* comments */

      /* ============================================================
     SPLIT VIEW (editor + preview)
     ============================================================ */
      #split-view {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: calc(100dvh - var(--header-h));
        gap: 0;
      }

      #editor-pane {
        overflow-y: auto;
        border-right: 1px solid var(--border);
        padding: 20px;
      }

      #preview-pane {
        overflow-y: auto;
        background: var(--bg-muted);
        padding: 20px;
      }

      /* Preview paper simulation */
      .resume-preview-paper {
        background: #ffffff;
        color: #111;
        border-radius: 4px;
        box-shadow: var(--shadow-lg);
        padding: 32px 36px;
        font-family: "Times New Roman", Times, serif;
        font-size: 11px;
        line-height: 1.5;
        min-height: 800px;
        position: relative;
      }

      [data-theme="dark"] .resume-preview-paper {
        background: #1a1d2b;
        color: #e0e4f0;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }

      /* Highlight active section in preview */
      .preview-section-active {
        outline: 2px solid var(--accent);
        border-radius: 4px;
        animation: sectionPulse 1s ease forwards;
      }

      @keyframes sectionPulse {
        0% {
          outline-color: var(--accent);
          box-shadow: 0 0 0 4px rgba(61, 95, 245, 0.2);
        }
        70% {
          outline-color: var(--accent);
          box-shadow: 0 0 0 8px rgba(61, 95, 245, 0.05);
        }
        100% {
          outline-color: transparent;
          box-shadow: none;
        }
      }

      /* ============================================================
     DRAG-AND-DROP SECTION ORDER
     ============================================================ */
      .sortable-ghost {
        opacity: 0.4;
        background: #dde7ff;
        border-radius: 6px;
      }

      [data-theme="dark"] .sortable-ghost {
        background: #1e2368;
      }

      .drag-handle {
        cursor: grab;
        color: var(--text-muted);
        display: flex;
        align-items: center;
      }
      .drag-handle:active {
        cursor: grabbing;
      }

      /* ============================================================
     TEMPLATE CARDS (selection grid)
     ============================================================ */
      .template-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }

      .template-card {
        border: 2px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition:
          border-color var(--transition),
          box-shadow var(--transition),
          transform 120ms;
        background: var(--bg-surface);
      }

      .template-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .template-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(61, 95, 245, 0.2);
      }

      .template-thumb {
        width: 100%;
        aspect-ratio: 8.5/11;
        background: #f8f9fc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #888;
        position: relative;
        overflow: hidden;
        padding: 8px;
      }

      .template-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .template-info {
        padding: 12px;
        border-top: 1px solid var(--border);
        font-weight: 600;
        font-size: 13px;
      }

      .template-info small {
        display: block;
        color: var(--text-muted);
        font-weight: 400;
        font-size: 11px;
        margin-top: 2px;
      }

      /* ============================================================
     SECTION ORDERING UI
     ============================================================ */
      .order-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--bg-muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        margin-bottom: 6px;
        cursor: grab;
        font-size: 13.5px;
        font-weight: 500;
      }

      .order-item .toggle-section {
        margin-left: auto;
        cursor: pointer;
        color: var(--text-muted);
      }

      /* ============================================================
     DASHBOARD STATS
     ============================================================ */
      .stat-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: center;
      }

      .stat-card .stat-num {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
        margin-bottom: 4px;
      }

      .stat-card .stat-label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* ============================================================
     EMPTY STATE
     ============================================================ */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        color: var(--text-muted);
      }

      .empty-state svg {
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-state h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      .empty-state p {
        font-size: 13px;
        max-width: 280px;
      }

      /* ============================================================
     SCROLL STYLE
     ============================================================ */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* ============================================================
     MOBILE OVERRIDES (≤ 768px — tablets & large phones)
     ============================================================ */
      @media (max-width: 768px) {
        :root {
          --sidebar-w: 0px;
          --header-h: 52px;
        }

        html {
          font-size: 15px;
        }

        body {
          font-size: 13px;
        }

        #app-shell {
          grid-template-columns: 1fr;
          grid-template-areas:
            "header"
            "main";
        }

        /* Header */
        #app-header {
          padding: 0 10px;
          gap: 8px;
        }

        .logo span {
          font-size: 34px;
          /* font-weight: 200;

    <script>
      'use strict';

      /* ============================================================
         MODULE: STORAGE MANAGER
         Handles all LocalStorage I/O with fallback error handling.
         ============================================================ */
      const StorageManager = (() => {
        const PREFIX = 'rf_';

        function get(key, fallback = null) {
          try {
            const raw = localStorage.getItem(PREFIX + key);
            return raw ? JSON.parse(raw) : fallback;
          } catch(e) {
            console.error('StorageManager.get error:', e);
            return fallback;
          }
        }

        function set(key, value) {
          try {
            localStorage.setItem(PREFIX + key, JSON.stringify(value));
            return true;
          } catch(e) {
            console.error('StorageManager.set error:', e);
            Toast.show('Storage error — data might not be saved.', 'error');
            return false;
          }
        }

        function remove(key) {
          try { localStorage.removeItem(PREFIX + key); } catch(e) {}
        }

        function clear() {
          try {
            Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k));
          } catch(e) {}
        }

        // Export full app data as JSON blob
        function exportAll() {
          const data = {
            _version: 1,
            _exported: new Date().toISOString(),
            profile: get('profile', {}),
            folders: get('folders', []),
            projects: get('projects', {}),
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href = url;
          a.download = `resumeforge-backup-${Date.now()}.json`;
          a.click();
          URL.revokeObjectURL(url);
          Toast.show('Export complete!', 'success');
        }

        // Import from JSON file
        function importAll(fileContent) {
          try {
            const data = JSON.parse(fileContent);
            if (!data._version) throw new Error('Invalid backup file');
            if (data.profile)   set('profile', data.profile);
            if (data.folders)   set('folders', data.folders);
            if (data.projects)  set('projects', data.projects);
            Toast.show('Import successful!', 'success');
            return true;
          } catch(e) {
            Toast.show('Import failed: ' + e.message, 'error');
            return false;
          }
        }

        return { get, set, remove, clear, exportAll, importAll };
      })();


      /* ============================================================
         MODULE: FOLDER MANAGER
         Manages folder CRUD, rendering sidebar folder tree.
         ============================================================ */
      const FolderManager = (() => {
        function getFolders() {
          return StorageManager.get('folders', []);
        }

        function saveFolders(folders) {
          StorageManager.set('folders', folders);
        }

        function createFolder(name) {
          if (!name) {
            Modal.prompt('New Folder', 'Folder name:', 'My Resumes', (val) => {
              if (!val.trim()) return;
              const folders = FolderManager.getFolders();
              folders.push({ id: uid(), name: val.trim(), open: true });
              FolderManager.saveFolders(folders);
              UI.renderSidebar();
              Toast.show('Folder created!', 'success');
            });
            return;
          }
          const folders = FolderManager.getFolders();
          folders.push({ id: uid(), name: name.trim(), open: true });
          FolderManager.saveFolders(folders);
          UI.renderSidebar();
        }

        function renameFolder(id) {
          const folders = FolderManager.getFolders();
          const f = folders.find(x => x.id === id);
          if (!f) return;
          Modal.prompt('Rename Folder', 'New name:', f.name, (val) => {
            
            if (!val.trim()) return;
            f.name = val.trim();
            FolderManager.saveFolders(folders);
            UI.renderSidebar();
          });
        }

        function deleteFolder(id) {
          Modal.confirm('Delete Folder', 'Delete this folder and ALL its projects? This cannot be undone.', () => {
            let folders = getFolders();
            folders = folders.filter(x => x.id !== id);
            FolderManager.saveFolders(folders);
            // Delete all projects in folder
            const projects = StorageManager.get('projects', {});
            Object.keys(projects).forEach(pid => {
              if (projects[pid].folderId === id) delete projects[pid];
            });
            StorageManager.set('projects', projects);
            UI.renderSidebar();
            Toast.show('Folder deleted.', 'success');
          });
        }

        function toggleFolder(id) {
          const folders = FolderManager.getFolders();
          const f = folders.find(x => x.id === id);
          if (f) { f.open = !f.open; FolderManager.saveFolders(folders); UI.renderSidebar(); }
        }

        function duplicateFolder(id) {
          const folders = FolderManager.getFolders();
          const src = folders.find(x => x.id === id);
          if (!src) return;
          const newId = uid();
          folders.push({ id: newId, name: src.name + ' (copy)', open: true });
          FolderManager.saveFolders(folders);
          // Duplicate projects
          const projects = StorageManager.get('projects', {});
          Object.values(projects).filter(p => p.folderId === id).forEach(p => {
            const np = JSON.parse(JSON.stringify(p));
            np.id = uid();
            np.folderId = newId;
            np.name = np.name + ' (copy)';
            projects[np.id] = np;
          });
          StorageManager.set('projects', projects);
          UI.renderSidebar();
          Toast.show('Folder duplicated!', 'success');
        }

        return { getFolders, saveFolders, createFolder, renameFolder, deleteFolder, toggleFolder, duplicateFolder };
      })();


      /* ============================================================
         MODULE: PROJECT MANAGER
         Manages resume project CRUD within folders.
         ============================================================ */
      const ProjectManager = (() => {
        function getAll() {
          return StorageManager.get('projects', {});
        }

        function get(id) {
          return getAll()[id] || null;
        }

        function save(project) {
          const all = getAll();
          all[project.id] = project;
          StorageManager.set('projects', all);
        }

        function create(folderId, name, templateId) {
          const profile = ProfileManager.getProfile();
          const project = {
            id: uid(),
            folderId,
            name: name || 'New Resume',
            templateId: templateId || 'ats-classic',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            // Section visibility & order
            sectionOrder: ['summary', 'experience', 'education', 'projects', 'skills', 'certifications', 'research', 'publications', 'awards', 'leadership', 'volunteering', 'languages', 'references'],
            hiddenSections: [],
            // Overrides: project-level data that overrides profile
            overrides: {},
          };
          save(project);
          UI.renderSidebar();
          return project;
        }

        function rename(id) {
          const p = get(id);
          if (!p) return;
          Modal.prompt('Rename Project', 'Project name:', p.name, (val) => {
            if (!val.trim()) return;
            p.name = val.trim();
            p.updatedAt = Date.now();
            save(p);
            UI.renderSidebar();
          });
        }

        function remove(id) {
          Modal.confirm('Delete Project', 'Delete this resume project? This cannot be undone.', () => {
            const all = getAll();
            delete all[id];
            StorageManager.set('projects', all);
            UI.renderSidebar();
            UI.navigate('dashboard');
            Toast.show('Project deleted.', 'success');
          });
        }

        function duplicate(id) {
          const src = get(id);
          if (!src) return;
          const np = JSON.parse(JSON.stringify(src));
          np.id = uid();
          np.name = src.name + ' (copy)';
          np.createdAt = Date.now();
          np.updatedAt = Date.now();
          save(np);
          UI.renderSidebar();
          Toast.show('Project duplicated!', 'success');
        }

        function moveToFolder(id, newFolderId) {
          const p = get(id);
          if (!p) return;
          p.folderId = newFolderId;
          p.updatedAt = Date.now();
          save(p);
          UI.renderSidebar();
        }

        // Get effective data: profile merged with project overrides
        function getEffectiveData(projectId) {
          const profile = ProfileManager.getProfile();
          const project = get(projectId);
          if (!project) return profile;
          // Deep merge overrides on top of profile
          return deepMerge(profile, project.overrides || {});
        }

        return { getAll, get, save, create, rename, remove, duplicate, moveToFolder, getEffectiveData };
      })();

      /* ============================================================
         MODULE: TEMPLATE REGISTRY
         Plugin-style registry. Every template is self-contained.

         HOW TO ADD A NEW TEMPLATE:
         1. Create a template object following the schema below.
         2. Call TemplateRegistry.register(yourTemplate) ONCE.
         3. Done — no other code needs to change.

         TEMPLATE OBJECT SCHEMA:
         {
           id:          string  — unique slug, e.g. "my-template"
           name:        string  — display name
           description: string  — short description
           thumbnail:   string  — image URL (or data URI) shown in the picker card
           targetAudience: string — who it's for
           defaultSectionOrder: string[] — preferred section order

           // VARIABLE MAP — maps template data keys to profile keys.
           // Use this to understand exactly which profile fields your
           // LaTeX generator can access via the `data` parameter.
           variableMap: {
             // Flat fields:
             NAME:         "data.firstName + ' ' + data.lastName",
             TITLE:        "data.professionalTitle",
             EMAIL:        "data.email",
             PHONE:        "data.phone",
             CITY:         "data.city",
             COUNTRY:      "data.country",
             LINKEDIN:     "data.linkedin",
             GITHUB:       "data.github",
             PORTFOLIO:    "data.portfolio",
             SUMMARY:      "data.summary",
             // Array fields (iterate):
             EDUCATION:    "data.education[]  → degree, institution, major, gpa, startDate, endDate, description",
             EXPERIENCE:   "data.experience[] → company, role, startDate, endDate, responsibilities (split by \n), achievements",
             PROJECTS:     "data.projects[]   → name, techStack, duration, description, github, liveLink",
             SKILLS:       "data.skills       → programming, frameworks, databases, cloud, devops, tools, languages, softSkills, other",
             CERTS:        "data.certifications[] → title, issuer, date, credentialUrl",
             RESEARCH:     "data.research[]   → paperName, venue, doi, url",
             AWARDS:       "data.awards[]     → award, organization, date, description",
             LEADERSHIP:   "data.leadership[] → position, organization, description",
             VOLUNTEERING: "data.volunteering[] → organization, role, description",
             LANGUAGES:    "data.languages[]  → language, proficiency",
             REFERENCES:   "data.references[] → name, title, company, email, phone",
           },

           // LaTeX generator — receives effective profile data and section config
           // Must return a valid LaTeX string for Overleaf compilation.
           latexGenerator(data, sections, hiddenSections) {
             // data = merged profile+overrides object (see variableMap)
             // sections = ordered array of section IDs
             // hiddenSections = array of section IDs to skip
             return "\\documentclass{article}\n...";
           },

           // Preview HTML generator — lightweight HTML for in-app preview
           previewGenerator(data, sections, hiddenSections) {
             return "<div>...</div>";
           }
         }

         LATEX HELPER FUNCTIONS AVAILABLE IN latexGenerator:
           ltx(str)         — escape special LaTeX characters
           ltxUrl(url)      — safe hyperref URL
           ltxDate(str)     — format date string

         ============================================================ */
      const TemplateRegistry = (() => {
        const registry = {};

        function register(template) {
          if (!template.id) { console.error('Template must have an id'); return; }
          registry[template.id] = template;
        }

        function get(id) { return registry[id] || null; }
        function getAll() { return Object.values(registry); }

        return { register, get, getAll };
      })();


      /* ============================================================
         LATEX UTILITY FUNCTIONS
         Available to all templates via the global scope.
         ============================================================ */

      // Escape special LaTeX characters
      function ltx(str) {
        if (!str) return '';
        return String(str)
          .replace(/\\/g, '\\textbackslash{}')
          .replace(/[&%$#_{}~^]/g, (m) => '\\' + m)
          .replace(/</g, '\\textless{}')
          .replace(/>/g, '\\textgreater{}');
      }

      // Format URL safely
      function ltxUrl(url) {
        if (!url) return '';
        // Hyperref handles most characters; just return cleaned URL
        return String(url).replace(/[{}\\]/g, '');
      }

      // Format date range
      function ltxDate(start, end) {
        const s = start || '';
        const e = end || 'Present';
        if (!s && !e) return '';
        if (!s) return e;
        return `${s} -- ${e}`;
      }

      // Split newline-separated responsibilities into LaTeX itemize items
      function ltxItems(text) {
        if (!text) return '';
        return text.split('\n').filter(l => l.trim()).map(l => `  \\item ${ltx(l.trim())}`).join('\n');
      }

      // Check if section should be included
      function sectionVisible(sectionId, hiddenSections) {
        return !(hiddenSections || []).includes(sectionId);
      }


      // ─────────────────────────────────────────────
// NEW TEMPLATE: "Skills-First ATS"
// Layout: Header → Summary → Skills → Projects
//         → Education → Certifications → Awards → Research Papers

// ─────────────────────────────────────────────
TemplateRegistry.register({

  id: 'skills-first-ats',

  name: 'Linear Verticle Flow',

  defaultSectionOrder: [
    'summary', 'skills', 'projects',
    'education', 'certifications', 'awards', 'research'
  ],

  // VARIABLE MAP — documents which data fields are used
  variableMap: {
    NAME:             "data.firstName + ' ' + data.lastName",
    TITLE:            "data.professionalTitle",
    EMAIL:            "data.email",
    PHONE:            "data.phone",
    ADDRESS:          "data.city + ', ' + data.country",
    LINKEDIN:         "data.linkedin",
    GITHUB:           "data.github",
    PORTFOLIO:        "data.portfolio",
    GOOGLE_SCHOLAR:   "data.googleScholar",
    SUMMARY:          "data.summary",
    SKILLS:           "data.skills.*",
    PROJECTS:         "data.projects[]",
    EDUCATION:        "data.education[]",
    CERTIFICATIONS:   "data.certifications[]",
    AWARDS:           "data.awards[]",
    RESEARCH:         "data.research[]",
  },

  // ─── LaTeX GENERATOR ────────────────────────────────────────────────────────
  latexGenerator(data, sections, hiddenSections) {

    // ── helpers ──────────────────────────────────────────────────────────────

    // Build a compact "label: value" skills row (skips empty values)
    function skillRow(label, value) {
      if (!value || !value.trim()) return '';
      return `  \\textbf{${label}:} & ${ltx(value)} \\\\\n`;
    }

    // Section title rule
    function secTitle(title) {
      return `\\section*{${ltx(title)}}\n\\vspace{-4pt}\\rule{\\linewidth}{0.4pt}\\vspace{2pt}\n`;
    }

    // ── header ───────────────────────────────────────────────────────────────
    const fullName   = ltx((data.firstName || '') + ' ' + (data.lastName || '')).trim();
    const title      = data.professionalTitle ? ltx(data.professionalTitle) : '';

    // Build one-line contact string (non-empty items only)
    const contactParts = [];
    if (data.email)    contactParts.push(`\\href{mailto:${ltxUrl(data.email)}}{${ltx(data.email)}}`);
    if (data.phone)    contactParts.push(ltx(data.phone));
    if (data.city || data.country)
      contactParts.push(ltx([data.city, data.country].filter(Boolean).join(', ')));
    if (data.linkedin)
      contactParts.push(`\\href{${ltxUrl(data.linkedin)}}{LinkedIn}`);
    if (data.github)
      contactParts.push(`\\href{${ltxUrl(data.github)}}{GitHub}`);
    if (data.portfolio)
      contactParts.push(`\\href{${ltxUrl(data.portfolio)}}{Portfolio}`);
    if (data.googleScholar)
      contactParts.push(`\\href{${ltxUrl(data.googleScholar)}}{Google Scholar}`);

    const contactLine = contactParts.join(' \\textbullet\\ ');

    let header = `% ── HEADER ──\n`;
    header += `{\\LARGE\\bfseries ${fullName}}\\\\[2pt]\n`;
    if (title) header += `{\\large ${title}}\\\\[4pt]\n`;
    if (contactLine) header += `{\\small ${contactLine}}\\\\[4pt]\n`;
    header += `\\vspace{4pt}\n\n`;

    // ── body (sections in user-defined order) ────────────────────────────────
    let body = '';

    for (const sec of sections) {
      if (hiddenSections.includes(sec)) continue;

      // ── Summary ────────────────────────────────────────────────────────────
      if (sec === 'summary' && data.summary) {
        body += secTitle('Summary');
        body += `${ltx(data.summary)}\n\n`;
      }

      // ── Skills ─────────────────────────────────────────────────────────────
      if (sec === 'skills') {
        const sk = data.skills || {};
        const rows =
          skillRow('Programming',  sk.programming) +
          skillRow('Frameworks',   sk.frameworks)  +
          skillRow('Databases',    sk.databases)   +
          skillRow('Cloud',        sk.cloud)        +
          skillRow('DevOps',       sk.devops)       +
          skillRow('Tools',        sk.tools)        +
          skillRow('Languages',    sk.languages)    +
          skillRow('Soft Skills',  sk.softSkills)   +
          skillRow('Other',        sk.other);

        if (rows.trim()) {
          body += secTitle('Skills');
          body += `\\begin{tabular}{@{}ll@{}}\n${rows}\\end{tabular}\n\n`;
        }
      }

      // ── Projects ───────────────────────────────────────────────────────────
      if (sec === 'projects' && data.projects && data.projects.length) {
        body += secTitle('Projects');
        data.projects.forEach(proj => {
          // Title + optional links on the right
          const links = [];
          if (proj.github)   links.push(`\\href{${ltxUrl(proj.github)}}{GitHub}`);
          if (proj.liveLink) links.push(`\\href{${ltxUrl(proj.liveLink)}}{Live}`);
          const linkStr = links.length ? ` \\hfill ${links.join(' | ')}` : '';

          body += `\\textbf{${ltx(proj.name)}}${linkStr}\\\\\n`;
          if (proj.techStack)
            body += `{\\small\\textit{${ltx(proj.techStack)}}}`;
          if (proj.duration)
            body += ` \\hfill {\\small ${ltx(proj.duration)}}`;
          body += `\\\\\n`;
          if (proj.description) {
            body += `\\begin{itemize}[leftmargin=*,noitemsep,topsep=2pt]\n`;
            body += `  \\item ${ltx(proj.description)}\n`;
            body += `\\end{itemize}\n`;
          }
          body += `\\vspace{4pt}\n`;
        });
        body += '\n';
      }

      // ── Education ──────────────────────────────────────────────────────────
      if (sec === 'education' && data.education && data.education.length) {
        body += secTitle('Education');
        data.education.forEach(edu => {
          body += `\\textbf{${ltx(edu.degree || '')}}`;
          if (edu.major) body += ` in ${ltx(edu.major)}`;
          body += ` \\hfill ${ltxDate(edu.startDate, edu.endDate)}\\\\\n`;
          body += `${ltx(edu.institution || '')}`;
          if (edu.gpa) body += ` \\hfill GPA: ${ltx(edu.gpa)}`;
          body += `\\\\\n`;
          if (edu.description) {
            body += `\\begin{itemize}[leftmargin=*,noitemsep,topsep=2pt]\n`;
            body += `  \\item ${ltx(edu.description)}\n`;
            body += `\\end{itemize}\n`;
          }
          body += `\\vspace{4pt}\n`;
        });
        body += '\n';
      }

      // ── Certifications ─────────────────────────────────────────────────────
      if (sec === 'certifications' && data.certifications && data.certifications.length) {
        body += secTitle('Certifications');
        body += `\\begin{itemize}[leftmargin=*,noitemsep,topsep=2pt]\n`;
        data.certifications.forEach(cert => {
          let line = `\\textbf{${ltx(cert.title || '')}}`;
          if (cert.issuer) line += ` --- ${ltx(cert.issuer)}`;
          if (cert.date)   line += ` \\hfill ${ltx(cert.date)}`;
          if (cert.credentialUrl)
            line += ` [\\href{${ltxUrl(cert.credentialUrl)}}{Verify}]`;
          body += `  \\item ${line}\n`;
        });
        body += `\\end{itemize}\n\n`;
      }

      // ── Awards ─────────────────────────────────────────────────────────────
      if (sec === 'awards' && data.awards && data.awards.length) {
        body += secTitle('Awards \\& Honors');
        body += `\\begin{itemize}[leftmargin=*,noitemsep,topsep=2pt]\n`;
        data.awards.forEach(aw => {
          let line = `\\textbf{${ltx(aw.award || '')}}`;
          if (aw.organization) line += `, ${ltx(aw.organization)}`;
          if (aw.date)         line += ` \\hfill ${ltx(aw.date)}`;
          if (aw.description)  line += `\\\\\n    {\\small ${ltx(aw.description)}}`;
          body += `  \\item ${line}\n`;
        });
        body += `\\end{itemize}\n\n`;
      }

      // ── Research Papers ────────────────────────────────────────────────────
      if (sec === 'research' && data.research && data.research.length) {
        body += secTitle('Research Papers');
        body += `\\begin{enumerate}[leftmargin=*,noitemsep,topsep=2pt]\n`;
        data.research.forEach(r => {
          let line = `${ltx(r.paperName || '')}`;
          if (r.venue) line += `. \\textit{${ltx(r.venue)}}`;
          const links = [];
          if (r.doi) links.push(`\\href{https://doi.org/${ltxUrl(r.doi)}}{DOI}`);
          if (r.url) links.push(`\\href{${ltxUrl(r.url)}}{Link}`);
          if (links.length) line += ` [${links.join(', ')}]`;
          body += `  \\item ${line}\n`;
        });
        body += `\\end{enumerate}\n\n`;
      }
    }

    // ── Full LaTeX document ──────────────────────────────────────────────────
    return `\\documentclass[10.5pt,a4paper]{article}
\\usepackage[top=0.55in,bottom=0.55in,left=0.65in,right=0.65in]{geometry}
\\usepackage{hyperref}
\\usepackage{enumitem}
\\usepackage{array}
\\usepackage{titlesec}

\\pagestyle{empty}
\\setlength{\\parindent}{0pt}
\\setlength{\\parskip}{0pt}
\\titlespacing*{\\section*}{0pt}{6pt}{2pt}

\\begin{document}

${header}
${body}
\\end{document}
`;
  },

        ? `<a href="${safe(data.github)}" target="_blank">GitHub</a>` : null,
      data.portfolio
        ? `<a href="${safe(data.portfolio)}" target="_blank">Portfolio</a>` : null,
      data.googleScholar
        ? `<a href="${safe(data.googleScholar)}" target="_blank">Google Scholar</a>` : null,
    ].filter(Boolean);
    if (cItems.length) {
      contactHtml = cItems.map(c => `<span>${c}</span>`).join('');
    }

    let html = style;
    html += `<div class="sf-wrap">`;
    html += `<div class="sf-name">${safe(fullName)}</div>`;
    if (data.professionalTitle)
      html += `<div class="sf-title-line">${safe(data.professionalTitle)}</div>`;
    if (contactHtml)
      html += `<div class="sf-contact">${contactHtml}</div>`;

    // ── SECTIONS ─────────────────────────────────────────────────────────────
    for (const sec of sections) {
      if (hiddenSections.includes(sec)) continue;

      // ── Summary ────────────────────────────────────────────────────────────
      if (sec === 'summary' && data.summary) {
        html += `<div class="preview-section" data-section="summary">`;
        html += `<div class="sf-sec-head">Summary</div><hr class="sf-rule">`;
        html += `<div class="sf-summary">${safe(data.summary)}</div>`;
        html += `</div>`;
      }

      // ── Skills ─────────────────────────────────────────────────────────────
      if (sec === 'skills') {
        const sk = data.skills || {};
        const rows = [
          ['Programming',  sk.programming],
          ['Frameworks',   sk.frameworks],
          ['Databases',    sk.databases],
          ['Cloud',        sk.cloud],
          ['DevOps',       sk.devops],
          ['Tools',        sk.tools],
          ['Languages',    sk.languages],
          ['Soft Skills',  sk.softSkills],
          ['Other',        sk.other],
        ].filter(([, v]) => v && v.trim());

        if (rows.length) {
          html += `<div class="preview-section" data-section="skills">`;
          html += `<div class="sf-sec-head">Skills</div><hr class="sf-rule">`;
          html += `<div class="sf-skills-grid">`;
          rows.forEach(([label, val]) => {
            html += `<span class="sf-sk-label">${safe(label)}</span>`;
            html += `<span class="sf-sk-val">${safe(val)}</span>`;
          });
          html += `</div></div>`;
        }
      }

      // ── Projects ───────────────────────────────────────────────────────────
      if (sec === 'projects' && data.projects && data.projects.length) {
        html += `<div class="preview-section" data-section="projects">`;
        html += `<div class="sf-sec-head">Projects</div><hr class="sf-rule">`;
        data.projects.forEach(proj => {
          const links = [];
          if (proj.github)
            links.push(`<a href="${safe(proj.github)}" target="_blank">GitHub</a>`);
          if (proj.liveLink)
            links.push(`<a href="${safe(proj.liveLink)}" target="_blank">Live</a>`);

          html += `<div class="sf-entry">`;
          html += `<div class="sf-entry-head">`;
          html += `<span class="sf-entry-main">${safe(proj.name)}</span>`;
          if (links.length)
            html += `<span class="sf-links">${links.join(' · ')}</span>`;
          html += `</div>`;
          html += `<div class="sf-entry-sub">`;
          html += `<span style="font-style:italic">${safe(proj.techStack || '')}</span>`;
          if (proj.duration)
            html += `<span>${safe(proj.duration)}</span>`;
          html += `</div>`;
          if (proj.description)
            html += `<div class="sf-entry-desc">${safe(proj.description)}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      // ── Education ──────────────────────────────────────────────────────────
      if (sec === 'education' && data.education && data.education.length) {
        html += `<div class="preview-section" data-section="education">`;
        html += `<div class="sf-sec-head">Education</div><hr class="sf-rule">`;
        data.education.forEach(edu => {
          const degreeLabel = [edu.degree, edu.major].filter(Boolean).join(' in ');
          html += `<div class="sf-entry">`;
          html += `<div class="sf-entry-head">`;
          html += `<span class="sf-entry-main">${safe(degreeLabel)}</span>`;
          html += `<span class="sf-entry-right">${safe(edu.startDate || '')}${edu.startDate && edu.endDate ? ' – ' : ''}${safe(edu.endDate || '')}</span>`;
          html += `</div>`;
          html += `<div class="sf-entry-sub">`;
          html += `<span>${safe(edu.institution || '')}</span>`;
          if (edu.gpa) html += `<span>GPA: ${safe(edu.gpa)}</span>`;
          html += `</div>`;
          if (edu.description)
            html += `<div class="sf-entry-desc">${safe(edu.description)}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      // ── Certifications ─────────────────────────────────────────────────────
      if (sec === 'certifications' && data.certifications && data.certifications.length) {
        html += `<div class="preview-section" data-section="certifications">`;
        html += `<div class="sf-sec-head">Certifications</div><hr class="sf-rule">`;
        html += `<ul class="sf-list">`;
        data.certifications.forEach(cert => {
          let line = `<strong>${safe(cert.title || '')}</strong>`;
          if (cert.issuer) line += ` &mdash; ${safe(cert.issuer)}`;
          if (cert.date)   line += ` <span style="float:right;color:#777">${safe(cert.date)}</span>`;
          if (cert.credentialUrl)
            line += ` <a href="${safe(cert.credentialUrl)}" target="_blank" style="font-size:9px;color:#555">[Verify]</a>`;
          html += `<li>${line}</li>`;
        });
        html += `</ul></div>`;
      }

      // ── Awards ─────────────────────────────────────────────────────────────
      if (sec === 'awards' && data.awards && data.awards.length) {
        html += `<div class="preview-section" data-section="awards">`;
        html += `<div class="sf-sec-head">Awards &amp; Honors</div><hr class="sf-rule">`;
        html += `<ul class="sf-list">`;
        data.awards.forEach(aw => {
          let line = `<strong>${safe(aw.award || '')}</strong>`;
          if (aw.organization) line += `, ${safe(aw.organization)}`;
          if (aw.date) line += ` <span style="float:right;color:#777">${safe(aw.date)}</span>`;
          if (aw.description)
            line += `<br><span style="color:#555;font-style:italic">${safe(aw.description)}</span>`;
          html += `<li>${line}</li>`;
        });
        html += `</ul></div>`;
      }

      // ── Research Papers ────────────────────────────────────────────────────
      if (sec === 'research' && data.research && data.research.length) {
        html += `<div class="preview-section" data-section="research">`;
        html += `<div class="sf-sec-head">Research Papers</div><hr class="sf-rule">`;
        html += `<ol class="sf-ol">`;
        data.research.forEach(r => {
          let line = safe(r.paperName || '');
          if (r.venue) line += `. <em>${safe(r.venue)}</em>`;
          const links = [];
          if (r.doi)
            links.push(`<a href="https://doi.org/${safe(r.doi)}" target="_blank">DOI</a>`);
          if (r.url)
            links.push(`<a href="${safe(r.url)}" target="_blank">Link</a>`);
          if (links.length)
            line += ` <span class="sf-links">[${links.join(', ')}]</span>`;
          html += `<li>${line}</li>`;
        });
        html += `</ol></div>`;
      }
    }

    html += `</div>`; // sf-wrap
    return html;
  }
});

// ═══════════════════════════════════════════════════════════════
// RESUMEFORGE PLUG-IN TEMPLATE
// Name:    Sidebar Pro — ATS Professional
// Layout:  Narrow left sidebar (28%) + Wide right main (72%)
//          LEFT:  Technical Skills · Certifications · Research · Languages
//          RIGHT: Header · Summary · Experience · Projects · Education · Awards
// Target:  Backend Engineers · ML Engineers · Tech Professionals
//
// HOW TO PLUG IN:
//   1. Open ResumeForge.html in any text editor
//   2. Find the comment:  /* END OF TEMPLATES */
//      OR find the last   TemplateRegistry.register({...});  block
//   3. Paste this ENTIRE block just after it, before
//   4. Save & reload — template appears in the picker automatically
// ═══════════════════════════════════════════════════════════════

TemplateRegistry.register({

  // ── METADATA ──────────────────────────────────────────────────
  id: 'sidebar-pro',
  name: '2 Column (25/75)',
  description: 'Narrow left sidebar with skills/certs, wide right column for experience. Ideal for tech professionals.',
  targetAudience: 'Backend · ML · Senior Engineers',

  // Image shown in the template picker. Replace with your own hosted image link.
  thumbnail: 'https://raw.githubusercontent.com/Irshad-11/Documents/218170840ee7a5add8c305fc73af634ac89b76e7/Screenshot%20from%202026-06-16%2016-48-44.png',

  // ── DEFAULT SECTION ORDER ─────────────────────────────────────
  // Left sidebar sections: skills, certifications, research, languages
  // Right main sections:   summary, experience, projects, education, awards, leadership, volunteering
  // The sectionOrder array controls render order within each column.
  defaultSectionOrder: [
    'summary', 'experience', 'projects', 'education',
    'skills', 'certifications', 'research', 'languages',
    'awards', 'leadership', 'volunteering', 'publications', 'references'
  ],

  // ── VARIABLE MAP (documentation — all fields this template uses) ─
  variableMap: {
    NAME:         "data.firstName + ' ' + data.lastName",
    TITLE:        "data.professionalTitle",           // e.g. "Backend Engineer | ML Engineer"
    CITY:         "data.city",
    COUNTRY:      "data.country",
    EMAIL:        "data.email",
    PHONE:        "data.phone",
    GITHUB:       "data.github",
    LINKEDIN:     "data.linkedin",
    PORTFOLIO:    "data.portfolio",
    SUMMARY:      "data.summary",
    EXPERIENCE:   "data.experience[] — company, role, startDate, endDate, responsibilities (one per line), achievements",
    PROJECTS:     "data.projects[]  — name, techStack, description, github, liveLink",
    EDUCATION:    "data.education[] — degree, institution, major, gpa, startDate, endDate",
    SKILLS: [
      "data.skills.programming  → 'Languages' row",
      "data.skills.frameworks   → 'Backend Development' row",
      "data.skills.databases    → 'Databases' row",
      "data.skills.cloud        → 'Cloud & DevOps' row",
      "data.skills.devops       → merged into Cloud row",
      "data.skills.tools        → 'Tools' row",
      "data.skills.other        → 'Other' row",
    ],
    CERTIFICATIONS: "data.certifications[] — title (bullet list)",
    RESEARCH:     "data.research[] — paperName (bullet list)",
    LANGUAGES:    "data.languages[] — language, proficiency",
    AWARDS:       "data.awards[]   — award, organization, date",
    LEADERSHIP:   "data.leadership[] — position, organization, description",
    VOLUNTEERING: "data.volunteering[] — role, organization, description",
  },

  // ══════════════════════════════════════════════════════════════
  // LaTeX GENERATOR
  // Produces a paracol two-column document matching the image layout:
  //   Left  28%: accent-rule section headers, compact bullet lists
  //   Right 72%: name header centered, bold role + italic company, bullets
  // ══════════════════════════════════════════════════════════════
  latexGenerator(data, sections, hiddenSections) {

    // ── helpers ──────────────────────────────────────────────────
    const hide = (sec) => (hiddenSections || []).includes(sec);
    const has  = (arr) => Array.isArray(arr) && arr.length > 0;

    // Full display name
    const fullName = ltx([data.firstName, data.middleName, data.lastName].filter(Boolean).join(' '));

    // Professional title — supports "Role | Role | Role" style
    const titleLine = data.professionalTitle
      ? `{\\small\\color{accent} ${ltx(data.professionalTitle)}}`
      : '';

    // Location + contact line
    const location = [data.city, data.country].filter(Boolean).map(ltx).join(', ');
    const contactParts = [
      data.phone    ? ltx(data.phone) : '',
      data.email    ? `\\href{mailto:${ltxUrl(data.email)}}{${ltx(data.email)}}` : '',
    ].filter(Boolean).join(' \\enspace\\textbar\\enspace ');

    // Social links line
    const socialParts = [
      data.github   ? `\\href{${ltxUrl(data.github)}}{\\texttt{github.com/${ltx(data.github.replace(/.*github\.com\//,''))}}}` : '',
      data.linkedin ? `\\href{${ltxUrl(data.linkedin)}}{\\texttt{linkedin.com/in/${ltx(data.linkedin.replace(/.*linkedin\.com\/in\//,''))}}}` : '',
      data.portfolio? `\\href{${ltxUrl(data.portfolio)}}{${ltx(data.portfolio.replace(/https?:\/\//,''))}}` : '',
    ].filter(Boolean).join(' \\enspace\\textbar\\enspace ');

    // ── LEFT COLUMN builder ──────────────────────────────────────
    let leftCol = '';

    // SKILLS (left)
    if (!hide('skills') && data.skills) {
      const sk = data.skills;
      const rows = [
        sk.programming && ['Languages',          sk.programming],
        sk.frameworks  && ['Backend Development', sk.frameworks],
        sk.databases   && ['Databases',           sk.databases],
        (sk.cloud||sk.devops) && ['Cloud \\& DevOps', [sk.cloud, sk.devops].filter(Boolean).join(', ')],
        sk.tools       && ['Tools',               sk.tools],
        sk.softSkills  && ['Soft Skills',         sk.softSkills],
        sk.other       && ['Other',               sk.other],
      ].filter(Boolean);

      if (rows.length) {
        leftCol += `
% ─── LEFT: TECHNICAL SKILLS ──────────────────
\\section{Technical Skills}
`;
        rows.forEach(([label, value]) => {
          leftCol += `\\textbf{${ltx(label)}}\\\\[1pt]
{\\small ${ltx(value)}}\\\\[5pt]
`;
        });
      }
    }

    // CERTIFICATIONS (left)
    if (!hide('certifications') && has(data.certifications)) {
      leftCol += `
% ─── LEFT: CERTIFICATIONS ────────────────────
\\section{Certifications}
\\begin{itemize}
${data.certifications.map(c =>
  `  \\item {\\small ${ltx(c.title)}${c.issuer ? ` -- ${ltx(c.issuer)}` : ''}}`
).join('\n')}
\\end{itemize}
`;
    }

    // RESEARCH INTERESTS (left)
    if (!hide('research') && has(data.research)) {
      leftCol += `
% ─── LEFT: RESEARCH ──────────────────────────
\\section{Research Interests}
\\begin{itemize}
${data.research.map(r =>
  `  \\item {\\small ${ltx(r.paperName)}${r.venue ? ` \\textit{(${ltx(r.venue)})}` : ''}}`
).join('\n')}
\\end{itemize}
`;
    }

    // LANGUAGES (left)
    if (!hide('languages') && has(data.languages)) {
      leftCol += `
% ─── LEFT: LANGUAGES ─────────────────────────
\\section{Languages}
\\begin{itemize}[itemsep=3pt]
${data.languages.map(l =>
  `  \\item {\\small \\textbf{${ltx(l.language)}}${l.proficiency ? ` --- ${ltx(l.proficiency)}` : ''}}`
).join('\n')}
\\end{itemize}
`;
    }

    // ── RIGHT COLUMN builder ─────────────────────────────────────
    let rightCol = '';

    // SUMMARY (right)
    if (!hide('summary') && data.summary) {
      rightCol += `
% ─── RIGHT: SUMMARY ──────────────────────────
\\section{Professional Summary}
${ltx(data.summary)}
\\vspace{2pt}
`;
    }

    // EXPERIENCE (right)
    if (!hide('experience') && has(data.experience)) {
      rightCol += `
% ─── RIGHT: EXPERIENCE ───────────────────────
\\section{Experience}
`;
      data.experience.forEach(exp => {
        const dateStr = ltxDate(exp.startDate, exp.endDate);
        const locStr  = exp.location ? ltx(exp.location) : (location || '');
        rightCol += `
\\textbf{${ltx(exp.role)}} \\hfill {\\small ${ltx(dateStr)}}\\\\
{\\color{accent}\\textit{${ltx(exp.company)}}}${locStr ? ` \\hfill {\\small\\textit{${ltx(locStr)}}}` : ''}
\\begin{itemize}
`;
        const lines = [
          ...(exp.responsibilities ? exp.responsibilities.split('\n').filter(l=>l.trim()) : []),
          ...(exp.achievements      ? exp.achievements.split('\n').filter(l=>l.trim())      : []),
        ];
        if (lines.length) {
          rightCol += lines.map(l => `  \\item ${ltx(l.trim())}`).join('\n') + '\n';
        }
        rightCol += `\\end{itemize}
\\vspace{4pt}
`;
      });
    }

    // PROJECTS (right)
    if (!hide('projects') && has(data.projects)) {
      rightCol += `
% ─── RIGHT: PROJECTS ─────────────────────────
\\section{Projects}
`;
      data.projects.forEach(proj => {
        const repoLink = proj.github   ? `\\href{${ltxUrl(proj.github)}}{GitHub}` : '';
        const liveLink = proj.liveLink ? `\\href{${ltxUrl(proj.liveLink)}}{Live Demo}` : '';
        const links    = [repoLink, liveLink].filter(Boolean).join(' \\textbar\\enspace ');
        rightCol += `
\\textbf{${ltx(proj.name)}}${links ? ` \\hfill {\\small ${links}}` : ''}\\\\
`;
        if (proj.techStack) {
          rightCol += `{\\small\\color{accent}\\textbf{Tech Stack:} ${ltx(proj.techStack)}}\\\\[2pt]\n`;
        }
        const descLines = (proj.description||'').split('\n').filter(l=>l.trim());
        if (descLines.length > 1) {
          rightCol += `\\begin{itemize}\n${descLines.map(l=>`  \\item ${ltx(l.trim())}`).join('\n')}\n\\end{itemize}\n`;
        } else if (proj.description) {
          rightCol += `{\\small ${ltx(proj.description)}}\\\\[2pt]\n`;
        }
        rightCol += `\\vspace{4pt}\n`;
      });
    }

    // EDUCATION (right)
    if (!hide('education') && has(data.education)) {
      rightCol += `
% ─── RIGHT: EDUCATION ────────────────────────
\\section{Education}
`;
      data.education.forEach(edu => {
        rightCol += `
\\textbf{${ltx(edu.degree)}${edu.major ? ` in ${ltx(edu.major)}` : ''}}\\\\
{\\color{accent}\\textit{${ltx(edu.institution)}}} \\hfill {\\small ${ltxDate(edu.startDate, edu.endDate)}}\\\\
${edu.gpa ? `{\\small GPA: ${ltx(edu.gpa)}}\\\\` : ''}
${edu.description ? `{\\small ${ltx(edu.description)}}\\\\` : ''}
\\vspace{4pt}
`;
      });
    }

    // AWARDS (right)
    if (!hide('awards') && has(data.awards)) {
      rightCol += `
% ─── RIGHT: AWARDS ───────────────────────────
\\section{Awards \\& Achievements}
\\begin{itemize}
${data.awards.map(a =>
  `  \\item \\textbf{${ltx(a.award)}}${a.organization ? ` -- ${ltx(a.organization)}` : ''}${a.date ? ` (${ltx(a.date)})` : ''}${a.description ? `\\\\\n  {\\small ${ltx(a.description)}}` : ''}`
).join('\n')}
\\end{itemize}
`;
    }

    // LEADERSHIP (right)
    if (!hide('leadership') && has(data.leadership)) {
      rightCol += `
% ─── RIGHT: LEADERSHIP ───────────────────────
\\section{Leadership}
\\begin{itemize}
${data.leadership.map(l =>
  `  \\item \\textbf{${ltx(l.position)}}, ${ltx(l.organization)}${l.description ? ` --- ${ltx(l.description)}` : ''}`
).join('\n')}
\\end{itemize}
`;
    }

    // VOLUNTEERING (right)
    if (!hide('volunteering') && has(data.volunteering)) {
      rightCol += `
% ─── RIGHT: VOLUNTEERING ─────────────────────
\\section{Volunteering}
\\begin{itemize}
${data.volunteering.map(v =>
  `  \\item \\textbf{${ltx(v.role)}}, ${ltx(v.organization)}${v.description ? ` --- ${ltx(v.description)}` : ''}`
).join('\n')}
\\end{itemize}
`;
    }

    // PUBLICATIONS (right, if visible)
    if (!hide('publications') && has(data.publications)) {
      rightCol += `
% ─── RIGHT: PUBLICATIONS ─────────────────────
\\section{Publications}
\\begin{itemize}
${data.publications.map(p =>
  `  \\item ${ltx(p.title)}${p.venue ? `, \\textit{${ltx(p.venue)}}` : ''}${p.year ? ` (${ltx(p.year)})` : ''}`
).join('\n')}
\\end{itemize}
`;
    }

    // REFERENCES (right, if visible)
    if (!hide('references') && has(data.references)) {
      rightCol += `
% ─── RIGHT: REFERENCES ───────────────────────
\\section{References}
\\begin{itemize}
${data.references.map(r =>
  `  \\item \\textbf{${ltx(r.name)}}${r.title ? `, ${ltx(r.title)}` : ''}${r.company ? ` -- ${ltx(r.company)}` : ''}${r.email ? ` -- \\href{mailto:${ltxUrl(r.email)}}{${ltx(r.email)}}` : ''}`
).join('\n')}
\\end{itemize}
`;
    }

    // ── ASSEMBLE FULL DOCUMENT ───────────────────────────────────
    return `%--------------------------------------------------
% Sidebar Pro — ATS Professional Resume
% Generated by ResumeForge
% Paste into Overleaf → compile with pdfLaTeX
% Requires: paracol package (available on Overleaf)
%--------------------------------------------------
\\documentclass[10pt, a4paper]{article}

\\usepackage[
  a4paper,
  top=0.50in, bottom=0.50in,
  left=0.55in, right=0.55in
]{geometry}
\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\usepackage{hyperref}
\\usepackage{enumitem}
\\usepackage{titlesec}
\\usepackage{xcolor}
\\usepackage{paracol}
\\usepackage{array}
\\usepackage{setspace}

%── COLOR PALETTE ────────────────────────────────
\\definecolor{accent}{HTML}{1A3A8F}       % deep navy blue
\\definecolor{rulecolor}{HTML}{1A3A8F}
\\definecolor{sidebarfill}{HTML}{F2F4FA}  % very light blue-grey sidebar bg
\\definecolor{subtletext}{HTML}{444444}
\\definecolor{linkcolor}{HTML}{1A3A8F}

%── HYPERLINKS ───────────────────────────────────
\\hypersetup{
  colorlinks=true,
  urlcolor=linkcolor,
  linkcolor=linkcolor
}

%── SECTION HEADING STYLE ────────────────────────
% Compact uppercase with accent underrule
\\titleformat{\\section}
  {\\normalfont\\small\\bfseries\\color{accent}}
  {}{0em}{\\uppercase}
  [\\vspace{1pt}\\color{rulecolor}\\titlerule\\vspace{4pt}]
\\titlespacing*{\\section}{0pt}{10pt}{4pt}

%── PAGE & PARAGRAPH ─────────────────────────────
\\pagestyle{empty}
\\setlength{\\parindent}{0pt}
\\setlength{\\parskip}{0pt}

%── LIST SETTINGS ────────────────────────────────
\\setlist[itemize]{
  leftmargin=1.1em,
  itemsep=1.5pt,
  topsep=2pt,
  parsep=0pt,
  label=\\textbullet
}

\\begin{document}

%════════════════════════════════════════════════
%  HEADER — Centered name + title + contact bar
%════════════════════════════════════════════════
\\begin{center}
  {\\fontsize{24}{28}\\selectfont\\bfseries\\color{accent} ${fullName}}\\\\[3pt]
  ${titleLine ? `${titleLine}\\\\[3pt]` : ''}
  {\\small\\color{subtletext}
    ${location ? `${ltx(location)} \\enspace\\textbar\\enspace ` : ''}${contactParts}
  }${socialParts ? `\\\\[2pt]\n  {\\small\\color{subtletext} ${socialParts}}` : ''}
\\end{center}
\\vspace{1pt}
{\\color{rulecolor}\\rule{\\linewidth}{1.2pt}}
\\vspace{3pt}

%════════════════════════════════════════════════
%  TWO-COLUMN BODY
%  Left 28% sidebar | Right 72% main
%════════════════════════════════════════════════
\\columnratio{0.28}
\\setlength{\\columnsep}{16pt}
\\begin{paracol}{2}

% ─── LEFT SIDEBAR ────────────────────────────
${leftCol || '% (no sidebar sections with data)'}

\\switchcolumn

% ─── RIGHT MAIN COLUMN ───────────────────────
${rightCol || '% (no main column sections with data)'}

\\end{paracol}

\\end{document}
`;
  }, // end latexGenerator


  // ══════════════════════════════════════════════════════════════
  // HTML PREVIEW GENERATOR

  previewGenerator(data, sections, hiddenSections) {

          ${he(data.professionalTitle)}

          ${[location, data.phone, data.email].filter(Boolean).map(he).join(' | ')}

        ${(data.github || data.linkedin || data.portfolio) ? `
        <div style="font-size:7.5px; color:#1A3A8F; margin-top:1px;">
          ${[
            data.github   ? he(data.github.replace(/https?:\/\//,'')) : '',
            data.linkedin ? he(data.linkedin.replace(/https?:\/\//,'')) : '',
            data.portfolio? he(data.portfolio.replace(/https?:\/\//,'')) : '',
          ].filter(Boolean).join(' | ')}
        </div>` : ''}
      </div>`;

    // ── Left sidebar content ──
    let leftHtml = '';

    // Skills
    if (!hide('skills') && data.skills) {
      const sk = data.skills;
      const rows = [
        sk.programming && ['Languages',        sk.programming],
        sk.frameworks  && ['Backend Dev',      sk.frameworks],
        sk.databases   && ['Databases',        sk.databases],
        (sk.cloud||sk.devops) && ['Cloud & DevOps', [sk.cloud,sk.devops].filter(Boolean).join(', ')],
        sk.tools       && ['Tools',            sk.tools],
        sk.softSkills  && ['Soft Skills',      sk.softSkills],
      ].filter(Boolean);

      if (rows.length) {
        leftHtml += `<div class="preview-section" data-section="skills">
          <div class="preview-section-title">Technical Skills</div>
          ${rows.map(([l,v]) => `
          <div style="margin-bottom:5px;">
            <div style="font-size:7.5px; font-weight:700; color:#1A3A8F;">${he(l)}</div>
            <div style="font-size:7px; color:#333; line-height:1.4;">${he(v)}</div>

        </div>`;
      }
    }

    // Certifications
    if (!hide('certifications') && has(data.certifications)) {
      leftHtml += `<div class="preview-section" data-section="certifications">
        <div class="preview-section-title">Certifications</div>
        ${data.certifications.map(c => `
        <div style="font-size:7px; padding:1px 0; border-bottom:0.5px solid #e5e7eb;">

    // ── Right main column content ──
    let rightHtml = '';

    // Summary
    if (!hide('summary') && data.summary) {

        <div style="font-size:7.5px; line-height:1.5; color:#222;">${he(data.summary)}</div>

    if (!hide('experience') && has(data.experience)) {
      rightHtml += `<div class="preview-section" data-section="experience">
        <div class="preview-section-title">Experience</div>

        <div style="margin-bottom:7px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-size:8.5px; font-weight:700;">${he(exp.role)}</span>

          </div>
          <div style="font-size:7.5px; color:#1A3A8F; font-style:italic; margin-bottom:2px;">${he(exp.company)}</div>
          ${exp.responsibilities ? exp.responsibilities.split('\n').filter(l=>l.trim()).slice(0,3).map(l=>
            `<div style="font-size:7px; color:#333; padding-left:8px;">• ${he(l.trim())}</div>`
          ).join('') : ''}
        </div>`).join('')}
      </div>`;
    }

    // Projects
    if (!hide('projects') && has(data.projects)) {
      rightHtml += `<div class="preview-section" data-section="projects">
        <div class="preview-section-title">Projects</div>
        ${data.projects.map(proj => `
        <div style="margin-bottom:6px;">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-size:8.5px; font-weight:700;">${he(proj.name)}</span>
            <span style="font-size:7px; color:#1A3A8F;">${proj.github?'GitHub':''}${proj.liveLink?' | Live Demo':''}</span>
          </div>

          ${proj.description ? `<div style="font-size:7px; color:#333; padding-left:8px;">• ${he(proj.description.split('\n')[0])}</div>` : ''}
        </div>`).join('')}
      </div>`;
    }

    // Education
    if (!hide('education') && has(data.education)) {
      rightHtml += `<div class="preview-section" data-section="education">
        <div class="preview-section-title">Education</div>
        ${data.education.map(edu => `
        <div style="margin-bottom:5px;">
          <div style="font-size:8.5px; font-weight:700;">${he(edu.degree)}${edu.major?' in '+he(edu.major):''}</div>

        </div>`).join('')}
      </div>`;

    // Awards
    if (!hide('awards') && has(data.awards)) {
      rightHtml += `<div class="preview-section" data-section="awards">
        <div class="preview-section-title">Awards</div>

        </div>`).join('')}
      </div>`;
    }

    // ── Assemble full preview ──
    return `
      ${headerHtml}
      <div style="display:grid; grid-template-columns:28% 72%; gap:10px; align-items:start;">

        <!-- LEFT SIDEBAR -->
        <div style="background:#F2F4FA; border-radius:3px; padding:8px 7px; min-height:200px;">

          ${rightHtml || '<div style="color:#aaa;font-size:8px;text-align:center;padding:10px 0;">Add profile data to see preview</div>'}
        </div>

      </div>
    `;
  }

      /* ============================================================

        }
        else if (sec === 'projects' && data.projects && data.projects.length) {
          content = data.projects.map(p => `

        }
        else if (sec === 'skills' && data.skills) {
          const rows = [
            ['Programming', data.skills.programming],
            ['Frameworks', data.skills.frameworks],
            ['Databases', data.skills.databases],
            ['Cloud & DevOps', data.skills.cloud || data.skills.devops],
            ['Tools', data.skills.tools],
          ].filter(r=>r[1]);
          content = rows.map(([l,v]) => `<div style="font-size:8px; margin-bottom:2px;"><strong>${he(l)}:</strong> ${he(v)}</div>`).join('');
        }
        else if (sec === 'certifications' && data.certifications && data.certifications.length) {
          content = data.certifications.map(c => `<div style="font-size:8px;">• ${he(c.title)} — ${he(c.issuer)}</div>`).join('');
        }
        else if (sec === 'awards' && data.awards && data.awards.length) {
          content = data.awards.map(a => `<div style="font-size:8px;">• ${he(a.award)} — ${he(a.organization)}</div>`).join('');
        }
        else if (sec === 'languages' && data.languages && data.languages.length) {
          content = `<div style="font-size:8px;">${data.languages.map(l => `${he(l.language)}${l.proficiency ? ' ('+he(l.proficiency)+')' : ''}`).join(' · ')}</div>`;

        else if (sec === 'research' && data.research && data.research.length) {
          content = data.research.map(r => `<div style="font-size:8px;">• ${he(r.paperName)}${r.venue ? ', '+he(r.venue) : ''}</div>`).join('');
